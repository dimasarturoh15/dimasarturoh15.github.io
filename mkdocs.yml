site_name: Dimas Arturoh
site_description: Proyek otomasi Python dan jurnal belajar saya.
site_author: Dimas Arturoh

site_url: https://dimasarturoh15.github.io/

copyright: "&copy; 2026 Dimas Arturoh"

theme:
  name: material
  custom_dir: overrides
  language: id
  # Font dimuat lewat extra_css agar bobot 500 dan 600 tersedia.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ganti ke mode gelap
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ganti ke mode terang
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap
  # Ganti nilai v setiap kali extra.css diubah agar browser tidak memakai versi lama dari cache.
  - stylesheets/extra.css?v=2026-11-07b

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dimasarturoh15
      name: GitHub saya

nav:
  - Beranda: index.md
  - Proyek:
      - projects/index.md
      - ChoraleStudio: projects/choralestudio.md
      - Liturgy Slides Automation: projects/liturgy-slides-automation.md
      - Livestream to Shorts Automation: projects/livestream-to-shorts-automation.md
  - Jurnal Belajar:
      - journal/index.md
      - "6 Nov 2026: Commit ChoraleStudio": journal/2026-11-06-choralestudio-commit.md
      - "6 Nov 2026: Pemaketan dan uji": journal/2026-11-06-pemaketan-dan-uji.md
      - "6 Nov 2026: Audio real-time dan mastering": journal/2026-11-06-audio-realtime-dan-mastering.md
      - "6 Nov 2026: ChoraleStudio dari PRD ke installer": journal/2026-11-06-chorale-dari-prd-ke-installer.md
      - "5 Nov 2026: Hari pertama": journal/2026-11-05.md
      - "5 Nov 2026: Proyek pertama": journal/2026-11-05-proyek-pertama.md
      - "5 Nov 2026: Proyek kedua": journal/2026-11-05-proyek-kedua.md
      - "5 Nov 2026: Merapikan portofolio": journal/2026-11-05-merapikan-portofolio.md

plugins: []

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
